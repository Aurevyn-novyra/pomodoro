<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">Focus</h1>
      <div class="mode-indicator">
        <span id="mode-label">Pomodoro</span>
      </div>
    </header>

    <section class="timer-section">
      <div class="progress-ring">
        <svg width="260" height="260">
          <circle class="bg" cx="130" cy="130" r="120"></circle>
          <circle class="progress" cx="130" cy="130" r="120"></circle>
        </svg>
        <div class="time-display">
          <span id="time">25:00</span>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="start" class="primary">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </section>

    <section class="modes">
      <button data-mode="pomodoro" class="mode active">Pomodoro</button>
      <button data-mode="short" class="mode">Short Break</button>
      <button data-mode="long" class="mode">Long Break</button>
    </section>

    <footer class="footer">
      <div class="stats">
        <span>Today</span>
        <strong id="today-count">0</strong>
        <span>Pomodoros</span>
      </div>
    </footer>
  </main>

  <audio id="alarm" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
